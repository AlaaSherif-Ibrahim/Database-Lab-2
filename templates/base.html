<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-Do{% endblock %} · To-Do</title>
  <!-- Bootstrap 5 + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <script>
    // Apply the saved theme before the page paints (bonus: dark mode)
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-bs-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <nav class="navbar border-bottom app-nav">
    <div class="container app-container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('todos') }}">
        <i class="bi bi-check2-square text-primary"></i> To-Do
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Toggle dark mode" aria-label="Toggle dark mode">
          <i class="bi bi-moon-stars"></i>
        </button>
        {% if session.get('user_id') %}
          <span class="d-none d-sm-inline text-body-secondary">Hi, <strong class="text-body">{{ session['name'] }}</strong></span>
          <a class="btn btn-sm btn-outline-danger" href="{{ url_for('logout') }}">
            <i class="bi bi-box-arrow-right"></i> Log out
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container app-container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
