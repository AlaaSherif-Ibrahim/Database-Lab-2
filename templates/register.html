{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h1 class="h4 fw-bold mb-1">Create an account</h1>
    <p class="text-body-secondary mb-4">Sign up to start your to-do list.</p>

    <!-- novalidate: we show our own messages instead of the browser's -->
    <form method="post" action="{{ url_for('register') }}" class="js-validate" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" value="{{ form.name }}" maxlength="100"
               class="form-control {% if errors.name %}is-invalid{% endif %}"
               data-required="Name is required" autocomplete="name">
        <div class="invalid-feedback">{{ errors.name }}</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" value="{{ form.email }}" maxlength="255"
               class="form-control {% if errors.email %}is-invalid{% endif %}"
               data-required="Email is required" autocomplete="email">
        <div class="invalid-feedback">{{ errors.email }}</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password"
               class="form-control {% if errors.password %}is-invalid{% endif %}"
               data-required="Password is required" autocomplete="new-password">
        <div class="invalid-feedback">{{ errors.password }}</div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password"
               class="form-control {% if errors.confirm_password %}is-invalid{% endif %}"
               data-required="Confirm password is required"
               data-match="password" data-match-msg="Passwords do not match"
               autocomplete="new-password">
        <div class="invalid-feedback">{{ errors.confirm_password }}</div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="text-center mt-4 mb-0 small">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
